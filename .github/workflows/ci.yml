name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval-regression:
    name: 评测集检索回归
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run eval regression
        run: python -m pytest tests/test_eval_regression.py -q
        env:
          # 强制 mock 模式，无需任何外部 API Key
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: hash
          RERANK_PROVIDER: cross_encoder_local
          REDIS_ENABLED: "False"
          QUALITY_INSPECT_ENABLED: "False"
