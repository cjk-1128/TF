# =====================================================================
#  TerraForge 容器编排
#  - terraforge : 后端 + 前端（多阶段镜像）
#  - redis      : Sprint1 多级缓存 L2（REDIS_ENABLED=1 时启用）
#  - nginx      : 反向代理 / 静态资源入口（80）
#
#  配置可通过项目根目录或本目录的 .env 覆盖（变量替换 ${VAR:-默认值}）。
#  常用变量：TERRAFORGE_PORT(默认 8001，避开同机 KnowForge 的 8000)、
#           NGINX_PORT(默认 80)、REDIS_ENABLED、LLM_PROVIDER 等。
# =====================================================================
version: "3.9"

services:
  terraforge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: terraforge:latest
    container_name: terraforge
    restart: unless-stopped
    ports:
      - "${TERRAFORGE_PORT:-8001}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/terraforge.db}
      LOCAL_VECTOR_DIR: "/data/vectorstore"
      UPLOAD_DIR: "/data/uploads"
      VECTOR_BACKEND: ${VECTOR_BACKEND:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-cross_encoder_local}
      RERANK_TIMEOUT: ${RERANK_TIMEOUT:-30}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      INTENT_AGENT_ENABLED: ${INTENT_AGENT_ENABLED:-1}
      INTENT_OUT_OF_SCOPE: ${INTENT_OUT_OF_SCOPE:-1}
      # ---- 多租户 / RBAC（Sprint4）----
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      RBAC_ENABLED: ${RBAC_ENABLED:-1}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-tf-admin-seed-key}
      MILVUS_HOST: ${MILVUS_HOST:-}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # ---- Redis 多级缓存 L2（Sprint1）----
      REDIS_ENABLED: ${REDIS_ENABLED:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
    volumes:
      - terraforge_data:/data
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: terraforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - terraforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: terraforge-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - terraforge

volumes:
  terraforge_data:
  terraforge_redis:
