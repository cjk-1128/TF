server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    # 后端 API / 健康检查 / OpenAPI 文档
    location /api/ {
        proxy_pass         http://terraforge:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
    }
    location /health   { proxy_pass http://terraforge:8000; }
    location /docs     { proxy_pass http://terraforge:8000; }
    location /openapi.json { proxy_pass http://terraforge:8000; }

    # 静态前端 + SPA history 模式回退
    location / {
        proxy_pass http://terraforge:8000;
        proxy_set_header Host $host;
    }
}