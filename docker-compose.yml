# TerraForge 容器编排（Phase 1：web + 复用同机 KnowForge 容器底座 MySQL/Milvus/Redis）
#
# Phase 1 数据底座（复用 KnowForge 容器，隔离方式）：
# - MySQL 8.4   → 新建独立库 `terraforge`（不碰 KnowForge 的 subjects_kg）
# - Milvus      → 集合用 `tf_kb_{kb_id}` 前缀命名空间（不碰 KnowForge 集合）
# - Redis 7.4   → 用 DB 1（`redis://.../1`，`tf:` 前缀）隔离
# 容器经 host.docker.internal 访问宿主服务（extra_hosts 注入网关），无需新建基础设施容器。
#
# 说明：
# - build context 为项目根，dockerfile 指向 backend/Dockerfile，COPY 以 backend/ 为基准。
# - Phase 6 生产加固：应用容器(web)不再直连宿主端口，统一经 nginx 反代（80→443 跳转 + TLS 终止）。
#   外部访问入口为宿主 80/443；如需临时回退直连，把 web.ports 改回 "8002:8001" 并移除 nginx 依赖即可。
# - 使用 bind 挂载（而非命名卷）保留 SQLite 评测库与本地向量，作为迁移源与 BM25 索引（BM25 仍走本地）。

services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: terraforge:latest
    container_name: terraforge
    env_file:
      - .env
    environment:
      # ===== Phase 1：生产数据底座（复用同机 KnowForge 容器，经 host.docker.internal 访问宿主）=====
      # 注意：含 & : @ 的 URL 必须加引号，否则 YAML 会把 & 解析为锚点导致值被置空
      DATABASE_URL: "mysql+pymysql://root:root123@host.docker.internal:13307/terraforge?charset=utf8mb4"
      VECTOR_BACKEND: milvus
      MILVUS_HOST: host.docker.internal
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: tf_chunks
      REDIS_ENABLED: "true"
      REDIS_URL: "redis://host.docker.internal:6379/1"
      # ===== 本地兜底 / 路径（BM25 仍走本地 pkl）=====
      LOCAL_VECTOR_DIR: /app/vectorstore
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/data/uploads
      # Phase 4 可观测性：结构化 JSON 日志（便于采集）；本地开发改回 text
      LOG_FORMAT: json
      # Phase 6 部署形态：单操作员 + 纯局域网 + 自签证书，前端无登录流程；
      # 当前前端除 eval/quality 外均不携带 X-API-Key，RBAC 开启会使 kb/doc/rag/gov 全 401。
      # 关闭后后端以虚拟 admin 放行（config 注释的"仅演示用"模式），SPA 全功能可用。
      # 若需严格鉴权，应先在前端加全局 X-API-Key 注入（需重建前端 dist，当前受 npm 工具链限制）。
      RBAC_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Phase 6：不再直连宿主端口，仅由同 compose 网络内的 nginx 通过 web:8001 访问
    # 如需临时回退直连调试，取消下一行注释：
    # ports:
    #   - "8002:8001"
    volumes:
      - ./docker_data:/app/data
      - ./docker_logs:/app/logs
      - ./docker_vector:/app/vectorstore
      # Phase 6 修复：挂载已构建的前端产物（VM 上 frontend/dist 已存在），
      # 使 uvicorn 托管 Vue SPA；否则 / 只会返回 JSON 信息页。
      - ./frontend/dist:/app/frontend/dist:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/ping',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Phase 6 生产加固：TLS 终止 + 反代 + 安全头 + 限速
  nginx:
    image: nginx:1.27-alpine
    container_name: terraforge-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/terraforge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1/nginx_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
