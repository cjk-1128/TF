# =====================================================================
#  TerraForge 生产反代配置（Phase 6 生产加固）
#  - 仅暴露 80/443，应用容器(web:8001)不再直连宿主端口
#  - 80 强制 301 跳转到 HTTPS（仅本地 /nginx_health 明文直返，供 nginx 自身健康检查）
#  - 443 终止 TLS（自签名，见 tools/gen_ssl.sh）+ 安全响应头 + 限速
#  注意：本文件被 nginx:alpine 的 http 块 include，故 limit_req_zone 处于 http 上下文。
# =====================================================================

# 速率限制区：单 IP 20 r/s，突发 40
limit_req_zone $binary_remote_addr zone=tf_api:10m rate=20r/s;

upstream terraforge_backend {
    server web:8001;
    keepalive 32;
}

# ---------------- HTTP：跳转 HTTPS ----------------
server {
    listen 80;
    server_name _;

    # 证书续期挑战目录（使用真实 CA 时启用）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # nginx 自身健康检查：本地直返 200，绝不依赖上游 web（避免级联不健康）
    location = /nginx_health {
        return 200 "ok\n";
        access_log off;
    }

    # /health 明文代理（便于外部明文探针，可选）
    location /health {
        proxy_pass http://terraforge_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # 其余一律 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------- HTTPS：应用入口 ----------------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/terraforge.crt;
    ssl_certificate_key /etc/nginx/ssl/terraforge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HSTS：强制后续访问走 HTTPS（自签名下浏览器仍会先警告一次）
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 通用安全响应头
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    client_max_body_size 50m;
    proxy_read_timeout   180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout   180s;

    # 轻量存活探针（瞬时、不依赖后端）：供 nginx 上游连通性快速判定
    location = /ping {
        proxy_pass http://terraforge_backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # API：限速 + 透传代理头（供 uvicorn --proxy-headers 识别真实客户端/IP/协议）
    location /api/ {
        limit_req zone=tf_api burst=40 nodelay;
        proxy_pass http://terraforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # 文档与 OpenAPI（不施加 CSP，避免破坏 Swagger UI CDN 资源加载）
    location /docs         { proxy_pass http://terraforge_backend; }
    location /openapi.json { proxy_pass http://terraforge_backend; }

    # 健康检查（关闭访问日志，减少噪声）
    location /health {
        proxy_pass http://terraforge_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # 其余路径（根 / SPA）透传
    location / {
        # 基础 CSP：仅允许同源；如需内联样式可放宽 style-src
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
        proxy_pass http://terraforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
